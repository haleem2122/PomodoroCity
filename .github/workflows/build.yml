name: Build, test and package
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14   # Apple-silicon (arm64) Mac, same architecture as an M2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers; uname -m; swift --version
      - name: Build
        run: swift build -c release 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Test
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Package DMG
        run: VERSION="0.${{ github.run_number }}.0" BUILD="${{ github.run_number }}" ./scripts/package.sh
      - name: Launch smoke test + screenshots (light and dark)
        continue-on-error: true
        run: |
          mkdir -p shots
          APPBIN="build/Pomodoro City.app/Contents/MacOS/PomodoroCity"
          DEMO="$RUNNER_TEMP/demo-save"
          python3 scripts/make_demo_save.py "$DEMO"
          shoot() {  # name, tab, extra-env
            local name="$1" tab="$2" extra="$3"
            env POMODORO_SAVE_DIR="$DEMO" POMODORO_TAB="$tab" $extra "$APPBIN" > "shots/$name.log" 2>&1 &
            local pid=$!
            sleep 7
            if kill -0 $pid 2>/dev/null; then echo "$name: running OK"; else echo "$name: APP CRASHED"; cat "shots/$name.log"; fi
            screencapture -x "shots/$name.png" || true
            kill $pid 2>/dev/null || true; sleep 1
          }
          shoot focus focus ""
          shoot focus-complete focus "POMODORO_DEMO_COMPLETE=1"
          shoot city city ""
          shoot progress history ""
          shoot settings settings ""
          if osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'; then
            sleep 2
            shoot dark-focus focus ""
            shoot dark-city city ""
            shoot dark-progress history ""
          else
            echo "could not switch to dark mode"
          fi
      - name: Publish CI output branch (logs and screenshots, readable via git)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-out && cp -R shots ci-out/ 2>/dev/null || true
          tail -n 400 build.log > ci-out/build.log 2>/dev/null || true
          tail -n 400 test.log > ci-out/test.log 2>/dev/null || true
          cd ci-out && git init -q -b ci-output && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "CI output for ${{ github.sha }}" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-screenshots
          path: |
            build.log
            test.log
            shots/
      - uses: actions/upload-artifact@v4
        with:
          name: PomodoroCity-dmg
          path: build/PomodoroCity.dmg
      - name: Publish release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/PomodoroCity.dmg --prerelease \
            --title "Pomodoro City build ${{ github.run_number }}" \
            --notes "Automated build. Passed tests on Apple silicon. Commit ${{ github.sha }}"
